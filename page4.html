        <h1>Forms</h1>
        <form>
            <label for="Username">Enter your Username</label>
            <input type="text"id="Username" name="Username" placeholder="Enter your Username"required>
            <br><br>
            <label for="Email">Enter your Email</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="password">Enter your password</label>
            <input type="password" id="password" name="password">
            <br>
            <p>Select your age</p>
            <input type="Radio" name="age" id="option one" value="0-10">
            <label for="option one">0-10</label><br>
            <input type="Radio" name="age" id="option two" value="11-20">
            <label for="option two">11-20</label><br>         
            <input type="Radio" name="age" id="option three" value="20 and above">
            <label for="option three">20 and above</label><br>
            <br>
            <p>Choose the best security question</p>
            <label for="question" id="question"></label>
            <input type="question" id="question">
            <option value="ql">Who was your best friend in high school</option>
            <option value="ql">What city did you grow up in</option>
            <option value="ql">what color socks did you what did febuary 17th</option>
            </select>
            <br><br>
            <label for="answer">security answer</label>
            <input type="text" name="answer" id="answer">
            <br><br>
            <label for="bio">Enter your bio here</label><br>
            <textarea name="bio" id="bio" cols="30" rows="10" placeholder="Enter your bio here"></textarea>
            <br><br>
            <label for="myfile">select a file to upload</label>
            <input type="file" name="myfile" id="myfile">
            <br><br>
            <label for="cc">What is your credit card information</label>
            <input type="text" id="cc" name="id" min="16" max="16" pattern="0-9" required>
            <!--This is the submit button--><br>
            <input type="submit" name="submit" id="submit">
        </form>
